name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer commit cancels a superseded pull request run, but never a main run that may be releasing. Main runs are
# keyed by sha so a queued run is never replaced by a newer push: every main commit needs its own sha-<7> images.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repo:
    name: Repo Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Docker Hub rate-limits anonymous pulls from shared runners: pull through mirror.gcr.io.
      - name: No Docker Hub images
        uses: fjcloudaiconsulting/.github/actions/no-docker-hub@v1

  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run backend tests
        run: python3 -m unittest

  # Built once, on the main push, as sha-<7> (pull requests build without pushing). Release only retags these.
  image:
    name: Image (${{ matrix.image }})
    strategy:
      matrix:
        include:
          - { image: backend, target: prod }
          - { image: migrations, target: migrations }
    permissions: { contents: read, packages: write }
    uses: fjcloudaiconsulting/.github/.github/workflows/build-image.yml@v1
    with:
      image: ${{ matrix.image }}
      context: backend
      target: ${{ matrix.target }}

  # Aggregate check, the name branch protection requires. Always runs; fails unless every gated job passed or was skipped.
  backend-checks:
    name: Backend Checks
    if: always()
    needs: [repo, test, image]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every gated job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS"

  # Releases only when every job above passed on this commit of main. The shared workflow runs release-please (App
  # token from this repo's `release` environment), then promote and smoke on a release.
  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [repo, test, image]
    permissions:
      contents: read
      checks: read
      pull-requests: read
      packages: write
    uses: fjcloudaiconsulting/.github/.github/workflows/release.yml@v1
    with:
      images: backend migrations
      health-url: http://localhost:8000/api/healthz
    secrets: inherit
